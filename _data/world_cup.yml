# World Cup 2026 watchability ratings.
# Spoiler-free: ratings reflect tension/drama only, never who won or any score.
# rating must be one of the keys in `ratings` below.
ratings:
  must:
    emoji: "🍿"
    label: "Must Watch"
  look:
    emoji: "👀"
    label: "Worth a Look"
  skip:
    emoji: "💤"
    label: "Skip"

