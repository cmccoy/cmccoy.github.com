title: Connor McCoy
description: Personal site of Connor McCoy, Principal Software Engineer.
url: https://www.cmccoy.us

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

exclude:
  - README.md
  - CLAUDE.md
