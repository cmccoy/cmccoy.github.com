<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Connor McCoy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..500;1,9..40,300..500&display=swap" rel="stylesheet">
  {%- comment -%}
    ?v=<build time> busts the 10-minute GitHub Pages cache on every deploy, so a
    fresh index.html never pairs with a stale stylesheet or script.
  {%- endcomment %}
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <main>
    <h1>{{ page.title | default: site.title }}</h1>
    {{ content }}
  </main>
</body>
</html>
