<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Connor McCoy">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <meta name="theme-color" content="#f8f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171613" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {%- if site.data.photos.size > 0 %}
  <meta property="og:image" content="{{ '/assets/photos/' | append: site.data.photos[0].slug | append: '.webp' | absolute_url }}">
  {%- endif %}
  <link rel="preload" href="{{ '/fonts/dm-sans-5.3.0-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {%- comment -%}
    ?v=<build time> busts the 10-minute GitHub Pages cache on every deploy, so a
    fresh index.html never pairs with a stale stylesheet or script.
  {%- endcomment %}
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <main>
    <h1>{{ page.title | default: site.title }}</h1>
    {{ content }}
  </main>
</body>
</html>
